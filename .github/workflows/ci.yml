name: CI

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    # Guardian is Arch-only (pacman, bsdtar, pacman-conf paths), so it is
    # built and tested on Arch.
    container: archlinux:base-devel
    steps:
      - name: Install toolchain and test tools
        run: pacman -Syu --noconfirm --needed rust git libarchive
      # Pinned by commit: a tag can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: No dependencies
        run: |
          count=$(cargo tree --locked -e normal,build,dev --depth 1 --prefix none | grep -c .)
          if [ "$count" -ne 1 ]; then
            cargo tree --locked -e normal,build,dev --depth 1
            echo "omarchy-guardian must not depend on any crate" >&2
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Shell syntax
        run: |
          for script in integrations/*.sh integrations/*/guardian-* integrations/omarchy/*.sh tests/e2e/*.sh; do
            bash -n "$script"
          done
